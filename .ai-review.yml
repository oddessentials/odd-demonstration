# AI Review Configuration for OSCR Testing
# This config enables local LLM reviews via Ollama

version: 1
trusted_only: true

triggers:
  on: [pull_request]
  branches: [main]

passes:
  - name: static
    agents: [semgrep]
    enabled: true

  - name: local-ai
    agents: [local_llm]
    enabled: true

limits:
  max_files: 50
  max_diff_lines: 2000
  max_tokens_per_pr: 8000
  max_usd_per_pr: 0  # No cloud API usage

reporting:
  github:
    mode: checks_and_comments
    max_inline_comments: 20
    summary: true
